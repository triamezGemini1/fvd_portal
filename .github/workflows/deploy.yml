# Despliegue automático: lo que está en Git (rama main) → carpeta beta en el hosting.
# Requiere secretos: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
# URL: https://federacionvenezolanadedomino.com/fvd_portal_beta/
#
# El .env no se sube (está en exclude); créelo en el servidor. Ver .env.production.example

name: Despliegue FTP — beta (fvd_portal_beta)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ftp-deploy-fvd-portal-beta
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-beta:
    name: Subir a public_html/fvd_portal_beta
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: public_html/fvd_portal_beta/
          security: loose
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.github*
            **/node_modules/**
            .env
            **/upload/**
            **/uploads/**
            **/.vscode/**
            **/.cursor/**
